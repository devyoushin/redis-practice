services:
  redis:
    image: redis:7.2
    container_name: redis-practice
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --bind
      - 0.0.0.0
      - --requirepass
      - redis-local-password
      - --maxmemory
      - 256mb
    ports:
      - "6379:6379"
    volumes:
      - ../config/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
