# Redis 설정 파일 — 운영 환경 권장 설정
# Redis 7.x 기준
# Bitnami Helm Chart 사용 시 values.yaml의 master.config 또는 replica.config에 삽입

# ============================================================
# 네트워크 설정
# ============================================================

# 특정 IP에서만 리스닝 (0.0.0.0은 운영 환경 비권장)
bind 127.0.0.1 -::1                # 로컬호스트만 (Kubernetes에서는 Pod IP 자동 설정)
port 6379                          # 기본 포트 (TLS 사용 시 0으로 비활성화)

# TLS 설정 (TLS 사용 시 아래 주석 해제)
# port 0
# tls-port 6380
# tls-cert-file /tls/redis.crt
# tls-key-file /tls/redis.key
# tls-ca-cert-file /tls/ca.crt
# tls-auth-clients yes
# tls-replication yes
# tls-protocols "TLSv1.2 TLSv1.3"

timeout 0                          # 클라이언트 연결 타임아웃 (0=무한)
tcp-keepalive 300                  # TCP keepalive 간격 (초)

# ============================================================
# 보안 설정
# ============================================================

requirepass <REDIS_PASSWORD>       # 비밀번호 (ACL 사용 시 ACL 파일로 관리)
protected-mode yes                 # 보안 모드 (외부 접근 시 인증 강제)

# 위험 명령어 비활성화
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
rename-command CONFIG "CONFIGXXX"  # 관리자 전용으로 rename

# ACL 파일 (Redis 6.0+ 사용자별 권한 관리)
# aclfile /etc/redis/users.acl

# ============================================================
# 메모리 설정
# ============================================================

maxmemory 4gb                      # 최대 메모리 (Pod 메모리의 70~80%)
maxmemory-policy allkeys-lru       # Eviction 정책 (범용 캐시: allkeys-lru)
maxmemory-samples 5                # LRU 샘플 수 (5=기본값, 정확도 vs 성능)

# 메모리 최적화
lazyfree-lazy-eviction yes         # 비동기 Eviction (응답 지연 최소화)
lazyfree-lazy-expire yes           # 비동기 만료 처리
lazyfree-lazy-server-del yes       # DEL 명령어 비동기 처리
lazyfree-lazy-user-del yes         # 사용자 DEL 비동기 처리

# 메모리 파편화 자동 정리 (Redis 4.0+)
activedefrag yes
active-defrag-threshold-lower 10   # 파편화 10% 이상 시 정리 시작
active-defrag-threshold-upper 25   # 25% 이상 시 최대 속도
active-defrag-ignore-bytes 100mb   # 100MB 미만은 정리 안 함

# ============================================================
# 영속성 설정 (RDB)
# ============================================================

# RDB 저장 조건
save 900 1                         # 900초 내 1개 이상 변경 시 저장
save 300 10                        # 300초 내 10개 이상 변경 시 저장
save 60 10000                      # 60초 내 10000개 이상 변경 시 저장

# RDB 파일 설정
rdbcompression yes                 # LZF 압축 활성화
rdbchecksum yes                    # CRC64 체크섬
dbfilename dump.rdb
dir /data

# RDB 저장 실패 시 쓰기 중단
stop-writes-on-bgsave-error yes

# ============================================================
# 영속성 설정 (AOF)
# ============================================================

appendonly yes                     # AOF 활성화 (운영 환경 권장)
appendfilename "appendonly.aof"
appendfsync everysec               # 1초마다 fsync (성능/안정성 균형)
no-appendfsync-on-rewrite no       # Rewrite 중에도 fsync 유지 (안전)

# AOF Rewrite 자동 실행 조건
auto-aof-rewrite-percentage 100    # 파일 크기 2배 시 Rewrite
auto-aof-rewrite-min-size 64mb     # 최소 64MB 이상일 때만

# AOF + RDB 혼합 형식 (빠른 로딩)
aof-use-rdb-preamble yes

# ============================================================
# 복제 설정 (Replica에서 설정)
# ============================================================

# replica-serve-stale-data yes      # 마스터 연결 끊겨도 오래된 데이터 제공
# replica-read-only yes             # Replica는 읽기 전용 (기본값)
# repl-backlog-size 64mb            # 복제 백로그 크기
# repl-backlog-ttl 3600             # 백로그 TTL (Replica 재연결 대기)

# ============================================================
# 성능 설정
# ============================================================

# Slow Log 설정
slowlog-log-slower-than 1000       # 1ms 이상 걸린 명령어 기록
slowlog-max-len 256                # 최대 저장 항목 수

# 스레드 설정
io-threads 4                       # I/O 스레드 수 (CPU 코어 수에 맞게 조정)
io-threads-do-reads yes            # 읽기도 I/O 스레드 사용

# 클라이언트 연결 제한
maxclients 1000                    # 최대 동시 연결 수 (기본 10000)

# ============================================================
# 클러스터 설정 (Cluster 모드 사용 시)
# ============================================================

# cluster-enabled yes
# cluster-config-file nodes.conf
# cluster-node-timeout 15000        # 노드 장애 판정 시간 (ms)
# cluster-require-full-coverage no  # 일부 슬롯 장애 시 서비스 지속

# ============================================================
# 모니터링 설정
# ============================================================

# Latency Monitoring
latency-monitor-threshold 50       # 50ms 이상 지연 시 기록
latency-tracking yes               # 지연 추적 활성화

# 메모리 사용 샘플링
active-expire-enabled yes          # 만료 키 즉시 정리
